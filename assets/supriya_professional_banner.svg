    <text x="100" y="315" fill="#7DD3FC" text-anchor="middle">React</text>

    <rect x="146" y="296" width="80" height="30" rx="6" fill="#0F1B2E" stroke="#334155"/>
    <text x="186" y="315" fill="#86EFAC" text-anchor="middle">Node.js</text>

    <rect x="236" y="296" width="96" height="30" rx="6" fill="#0F1B2E" stroke="#334155"/>
    <text x="284" y="315" fill="#FDE68A" text-anchor="middle">JavaScript</text>

    <rect x="342" y="296" width="98" height="30" rx="6" fill="#0F1B2E" stroke="#334155"/>
