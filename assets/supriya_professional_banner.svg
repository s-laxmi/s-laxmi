<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#141C2F"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.5"/>

  <!-- soft accent glow -->
  <circle cx="1080" cy="60" r="180" fill="#38BDF8" opacity="0.06"/>
  <circle cx="120" cy="360" r="160" fill="#818CF8" opacity="0.06"/>

  <!-- left accent rail -->
  <rect x="0" y="0" width="6" height="400" fill="url(#accentText)"/>

  <!-- LEFT CONTENT -->
  <text x="64" y="88" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#5EEAD4" letter-spacing="2">OPEN TO WORK &#8226; FULL STACK DEVELOPMENT</text>

