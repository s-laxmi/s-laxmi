      <text x="960" y="208" fill="#94A3B8">,</text>

      <text x="668" y="236" fill="#7DD3FC">stack</text>
      <text x="716" y="236" fill="#94A3B8">: [</text>
      <text x="738" y="236" fill="#FDE68A">"React"</text>
      <text x="808" y="236" fill="#94A3B8">,</text>
      <text x="818" y="236" fill="#FDE68A">"Node"</text>
      <text x="878" y="236" fill="#94A3B8">,</text>
      <text x="888" y="236" fill="#FDE68A">"SQL"</text>
      <text x="936" y="236" fill="#94A3B8">],</text>

