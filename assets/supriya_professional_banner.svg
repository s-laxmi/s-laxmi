  <text x="64" y="266" font-family="'Inter', sans-serif" font-size="15" fill="#CBD5E1">maintainable code &#8212; from database to UI.</text>

  <!-- skill badges -->
  <g font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500">
