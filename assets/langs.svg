<svg viewBox="0 0 480 240" width="480" height="240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most used languages">
  <defs>
    <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c28"/>
      <stop offset="100%" stop-color="#1b0b32"/>
    </linearGradient>
  </defs>
  <style>
    .card2 { fill:url(#bgG2); stroke:#4b3fa0; stroke-width:1.2; }
    .title2 { font-family:'Segoe UI',Arial,sans-serif; font-size:16px; font-weight:700; fill:#e8e6ff; }
    .lang-row { opacity:0; transform: translateX(-10px); animation: rowIn .5s ease-out forwards; }
    @keyframes rowIn { to { opacity:1; transform:translateX(0); } }
    .lang-label { font-family:'Segoe UI',Arial,sans-serif; font-size:12.5px; fill:#e8e6ff; }
    .lang-pct { font-family:'Segoe UI',Arial,sans-serif; font-size:12px; fill:#9d97c9; }
    .lang-bar-bg { fill:#221c4a; }
    .lang-bar-fg { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: growW 1s ease-out forwards; }
    @keyframes growW { to { transform: scaleX(1); } }
  </style>
  <rect class="card2" x="1" y="1" width="478" height="238" rx="14"/>
  <text class="title2" x="24" y="28">Most Used Languages</text>
  <g transform="translate(30,20)">
    <g class="lang-row" style="animation-delay:0.00s" transform="translate(0,44)">
      <circle cx="4" cy="-4" r="5" fill="#f1e05a"/>
      <text class="lang-label" x="16" y="0">JavaScript</text>
      <text class="lang-pct" x="310" y="0">34%</text>
      <rect class="lang-bar-bg" x="0" y="6" width="320" height="8" rx="4"/>
      <rect class="lang-bar-fg" x="0" y="6" width="109" height="8" rx="4" fill="#f1e05a" style="animation-delay:0.30s"/>
    </g><g class="lang-row" style="animation-delay:0.12s" transform="translate(0,76)">
      <circle cx="4" cy="-4" r="5" fill="#b07219"/>
      <text class="lang-label" x="16" y="0">Java</text>
      <text class="lang-pct" x="310" y="0">24%</text>
      <rect class="lang-bar-bg" x="0" y="6" width="320" height="8" rx="4"/>
      <rect class="lang-bar-fg" x="0" y="6" width="77" height="8" rx="4" fill="#b07219" style="animation-delay:0.42s"/>
    </g><g class="lang-row" style="animation-delay:0.24s" transform="translate(0,108)">
      <circle cx="4" cy="-4" r="5" fill="#3572A5"/>
      <text class="lang-label" x="16" y="0">Python</text>
      <text class="lang-pct" x="310" y="0">18%</text>
      <rect class="lang-bar-bg" x="0" y="6" width="320" height="8" rx="4"/>
      <rect class="lang-bar-fg" x="0" y="6" width="58" height="8" rx="4" fill="#3572A5" style="animation-delay:0.54s"/>
    </g><g class="lang-row" style="animation-delay:0.36s" transform="translate(0,140)">
      <circle cx="4" cy="-4" r="5" fill="#e34c26"/>
      <text class="lang-label" x="16" y="0">HTML</text>
      <text class="lang-pct" x="310" y="0">12%</text>
      <rect class="lang-bar-bg" x="0" y="6" width="320" height="8" rx="4"/>
      <rect class="lang-bar-fg" x="0" y="6" width="38" height="8" rx="4" fill="#e34c26" style="animation-delay:0.66s"/>
    </g><g class="lang-row" style="animation-delay:0.48s" transform="translate(0,172)">
      <circle cx="4" cy="-4" r="5" fill="#563d7c"/>
      <text class="lang-label" x="16" y="0">CSS</text>
      <text class="lang-pct" x="310" y="0">8%</text>
      <rect class="lang-bar-bg" x="0" y="6" width="320" height="8" rx="4"/>
      <rect class="lang-bar-fg" x="0" y="6" width="26" height="8" rx="4" fill="#563d7c" style="animation-delay:0.78s"/>
    </g><g class="lang-row" style="animation-delay:0.60s" transform="translate(0,204)">
      <circle cx="4" cy="-4" r="5" fill="#8a8a8a"/>
      <text class="lang-label" x="16" y="0">Other</text>
      <text class="lang-pct" x="310" y="0">4%</text>
      <rect class="lang-bar-bg" x="0" y="6" width="320" height="8" rx="4"/>
      <rect class="lang-bar-fg" x="0" y="6" width="13" height="8" rx="4" fill="#8a8a8a" style="animation-delay:0.90s"/>
    </g>
  </g>
</svg>