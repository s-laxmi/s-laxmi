<svg viewBox="0 0 480 260" width="480" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub stats card">
  <defs>
    <linearGradient id="ringG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c28"/>
      <stop offset="100%" stop-color="#1b0b32"/>
    </linearGradient>
  </defs>
  <style>
    .card { fill: url(#bgG); stroke: #4b3fa0; stroke-width: 1.2; }
    .title { font-family:'Segoe UI',Arial,sans-serif; font-size:16px; font-weight:700; fill:#e8e6ff; }
    .ring-bg { fill:none; stroke:#241c4a; stroke-width:10; }
    .ring-fg { fill:none; stroke:url(#ringG); stroke-width:10; stroke-linecap:round;
      stroke-dasharray:339.3; stroke-dashoffset:339.3;
      animation: ringFill 1.6s ease-out 0.3s forwards; transform:rotate(-90deg); transform-box: fill-box; transform-origin: center; }
    @keyframes ringFill { to { stroke-dashoffset:74.6; } }
    .rank-text { font-family:'Segoe UI',Arial,sans-serif; font-size:22px; font-weight:800; fill:#ffffff; text-anchor:middle; opacity:0; animation: fadeIn .6s ease-out 1.6s forwards; }
    .rank-sub { font-family:'Segoe UI',Arial,sans-serif; font-size:11px; fill:#9d97c9; text-anchor:middle; opacity:0; animation: fadeIn .6s ease-out 1.7s forwards; }
    @keyframes fadeIn { to { opacity:1; } }
    .stat-row { opacity:0; transform:translateX(-14px); animation: slideIn .5s ease-out forwards; }
    @keyframes slideIn { to { opacity:1; transform:translateX(0); } }
    .row-label { font-family:'Segoe UI',Arial,sans-serif; font-size:13px; fill:#c9c3f0; }
    .row-val { font-family:'Segoe UI',Arial,sans-serif; font-size:13px; font-weight:700; fill:#ffffff; text-anchor:end; }
  </style>
  <rect class="card" x="1" y="1" width="478" height="258" rx="14"/>
  <text class="title" x="24" y="30">Supriya's GitHub Stats</text>

  <g transform="translate(90,144.0)">
    <circle class="ring-bg" cx="0" cy="0" r="54"/>
    <circle class="ring-fg" cx="0" cy="0" r="54"/>
    <text class="rank-text" x="0" y="6">A+</text>
    <text class="rank-sub" x="0" y="26">RANK</text>
  </g>

  <g transform="translate(150,82.0)">
    <g class="stat-row" style="animation-delay:0.00s" transform="translate(0,50)">
      <text class="row-label" x="0" y="0">Total Stars</text>
      <text class="row-val" x="270" y="0">128</text>
    </g><g class="stat-row" style="animation-delay:0.15s" transform="translate(0,82)">
      <text class="row-label" x="0" y="0">Total Commits</text>
      <text class="row-val" x="270" y="0">940</text>
    </g><g class="stat-row" style="animation-delay:0.30s" transform="translate(0,114)">
      <text class="row-label" x="0" y="0">Total PRs</text>
      <text class="row-val" x="270" y="0">36</text>
    </g><g class="stat-row" style="animation-delay:0.45s" transform="translate(0,146)">
      <text class="row-label" x="0" y="0">Total Issues</text>
      <text class="row-val" x="270" y="0">14</text>
    </g><g class="stat-row" style="animation-delay:0.60s" transform="translate(0,178)">
      <text class="row-label" x="0" y="0">Contributed To</text>
      <text class="row-val" x="270" y="0">9</text>
    </g>
  </g>
</svg>